spring.application.name=auth

# Server
server.port=8080

# DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=auth
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

##Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER_NAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.base-url=http://localhost:5173

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Refresh-token cookie
# Set app.cookie.secure=true once the app is served over HTTPS in production.
app.cookie.secure=false
app.cookie.same-site=Lax

# Frontend URL — used to build redirect targets (OAuth callback, email links use app.base-url above)
app.frontend-url=http://localhost:5173

# Password reset
app.password-reset.expiration-minutes=30

# Google OAuth ("Continue with Google")
# Create credentials at https://console.cloud.google.com/apis/credentials
# Authorized redirect URI must exactly match google.oauth.redirect-uri below.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_SECRET_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
google.oauth.redirect-uri=http://localhost:8080/api/auth/google/callback

# Auditing
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

